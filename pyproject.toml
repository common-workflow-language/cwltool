[build-system]
requires = [
    "setuptools>=45",
    "setuptools_scm[simple]>=8.0.4,<11",
    "mypy==2.4.1",  # also update dependency-groups.mypy below
    "types-requests",
    "types-psutil>=7.1.3.20251210",
    "ruamel.yaml>=0.16.0,<0.20",
    "schema-salad>=8.10,<9",
    "cwl-utils>=0.44",
    "prov[xml,rdf]>=3.2.2,<3.3",  # needed so mypyc/mypy can resolve prov's inline types during build
    "toml",
    "argcomplete>=1.12.0",
    "rich-argparse",
    "pygments>=2.20.0",  # fix for CVE-2026-4539
    "pydot >= 1.4.1"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
lint = [
  "flake8-bugbear<26.11",
  "black==26.*",
  "codespell",
]
mypy = [
  "mypy==2.4.1",  # also update build-systems.requires above
  "ruamel.yaml>=0.16.0,<0.20",
  "cwl-utils>=0.44",
  "cwltest",
  "types-requests",
  "types-setuptools",
  "types-psutil>=7.1.3.20251210",
  "types-mock",
  "galaxy-tool-util>=22.1.2,!=23.0.1,!=23.0.2,!=23.0.3,!=23.0.4,!=23.0.5,<26.2; python_version < '3.15'",
  "pydantic>=2.12.0; python_version >= '3.14' and python_version < '3.15'",
]
test = [
  "bagit>=1.6.4,<1.10",
  "pytest>= 6.2,< 9.3",
  "pytest-xdist>=3.2.0",  # for the worksteal scheduler
  "psutil",  # enhances pytest-xdist to allow "-n logical"
  "pytest-httpserver",
  "pytest-retry",
  "mock>=2.0.0",
  "pytest-mock>=1.10.0",
  "pytest-cov",
  "arcp>=0.2.0",
  "galaxy-tool-util>=22.1.2,!=23.0.1,!=23.0.2,!=23.0.3,!=23.0.4,!=23.0.5,<26.2; python_version < '3.15'",
  "pydantic>=2.12.0; python_version >= '3.14' and python_version < '3.15'",
]
cibw = [
  "cibuildwheel>=3.1"
]
dev = [
  {include-group = "lint"},
  {include-group = "mypy"},
  {include-group = "test"},
  {include-group = "cibw"},
  "diff_cover",
  "pylint",
  "pep257",
  "pydocstyle",
  "tox>4",
  "auto-walrus",
  "isort",
  "wheel",
  "autoflake",
  "pyupgrade",
  "bandit",
]

[tool.cibuildwheel]
test-command = "python -m pytest --ignore cwltool/schemas -n logical --dist worksteal --junitxml={project}/test-results/junit_$(python -V | awk '{print $2}')_${AUDITWHEEL_PLAT}.xml -k 'not (test_bioconda or test_env_filtering or test_udocker)' --pyargs cwltool"
test-groups = ["test"]
build-verbosity = 1
environment = { CWLTOOL_USE_MYPYC="1", MYPYPATH="$(pwd)/mypy-stubs" }
skip = ["cp31?t-*"]
# cp31?t-*: Skip free-threaded builds, as mypyc does not support them yet
# https://mypy.readthedocs.io/en/stable/changelog.html#mypyc-partial-unsafe-support-for-free-threading

# Install system library
[tool.cibuildwheel.linux]
before-all = "apk add libxml2-dev libxslt-dev nodejs || yum install -y libxml2-devel libxslt-devel nodejs environment-modules || apt-get install -y --no-install-recommends libxml2-dev libxslt-dev nodejs environment-modules"

[tool.black]
line-length = 100
target-version = [ "py310" ]
